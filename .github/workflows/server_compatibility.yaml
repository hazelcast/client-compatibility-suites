name: Test Server Backwards Compatibility

on:
  workflow_dispatch:
    inputs:
      organization_name:
        description: Name of the organization to build JARs from. If you want to run the tests with the JARs from your fork, set this to your username
        required: true
        default: hazelcast
      branch_name:
        description: Name of the branch to build JARs from
        required: true
        default: master
      run_python:
        description: run Python client tests
        type: boolean
        required: true
        default: true
      run_nodejs:
        description: run Node.js client tests (not supported client)
        type: boolean
        required: true
        default: false
      run_cpp:
        description: run CPP client tests (not supported client)
        type: boolean
        required: true
        default: false
      run_csharp:
        description: run Csharp client tests
        type: boolean
        required: true
        default: true
      run_go:
        description: run Go client tests (not supported client)
        type: boolean
        required: true
        default: false
jobs:
  upload_jars:
    name: Create and upload JARs
    runs-on: ubuntu-latest
    outputs:
      hz_version: ${{ steps.compute_hz_version.outputs.hz_version }}
      hazelcast_enterprise_key_secret: ${{ steps.get-enterprise-license.outputs.HAZELCAST_ENTERPRISE_KEY_SECRET }}
    env:
      MAVEN_ARGS: '--batch-mode --no-transfer-progress'
    steps:
      - name: Checkout to scripts
        uses: actions/checkout@v6
        with:
          path: master
      - name: Read Java Config
        run: cat ${{ github.workspace }}/master/.github/java-config.env >> $GITHUB_ENV
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Checkout to test artifacts
        uses: actions/checkout@v6
        with:
          repository: hazelcast/private-test-artifacts
          path: certs
          ref: data
          token: ${{ secrets.GH_PAT }}
      - name: Checkout to Hazelcast Mono ${{ github.event.inputs.branch_name }}
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.inputs.organization_name }}/hazelcast-mono
          path: hazelcast-mono
          ref: ${{ github.event.inputs.branch_name }}
          token: ${{ secrets.GH_PAT }}
      - name: Build JARs
        run: ./mvnw clean install --activate-profiles quick
        working-directory: hazelcast-mono
      - name: Compute HZ_VERSION
        id: compute_hz_version
        run: echo "hz_version=$(./mvnw help:evaluate -Dexpression=project.version --quiet -DforceStdout --raw-streams)" >> ${GITHUB_OUTPUT}
        working-directory: hazelcast-mono
      - name: Upload Hazelcast JAR
        uses: actions/upload-artifact@v7
        with:
          name: hazelcast
          path: hazelcast-mono/hazelcast/hazelcast/target/hazelcast-*[!s].jar
          retention-days: 1
      - name: Upload Hazelcast SQL JAR (if exists)
        uses: actions/upload-artifact@v7
        with:
          name: hazelcast-sql
          path: hazelcast-mono/hazelcast/hazelcast-sql/target/hazelcast-sql-*[!s].jar
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload Hazelcast tests JAR
        uses: actions/upload-artifact@v7
        with:
          name: hazelcast-tests
          path: hazelcast-mono/hazelcast/hazelcast/target/hazelcast-*-tests.jar
          retention-days: 1
      - name: Upload Hazelcast Enterprise JAR
        uses: actions/upload-artifact@v7
        with:
          name: hazelcast-enterprise
          path: hazelcast-mono/hazelcast-enterprise/target/hazelcast-enterprise-*[!s].jar
          retention-days: 1
      - name: Rename certs.jar as Hazelcast Enterprise tests JAR
        run: |
          HZ_TESTS_JAR_NAME=$(basename $(ls $GITHUB_WORKSPACE/hazelcast-mono/hazelcast/hazelcast/target/hazelcast-*-tests.jar))
          HZ_ENTERPRISE_TESTS_JAR_NAME=$(echo $HZ_TESTS_JAR_NAME | sed "s/hazelcast/hazelcast-enterprise/") 
          mv certs.jar $HZ_ENTERPRISE_TESTS_JAR_NAME
        working-directory: certs
      - name: Upload certificates as Hazelcast Enterprise tests JAR
        uses: actions/upload-artifact@v7
        with:
          name: hazelcast-enterprise-tests
          path: certs/hazelcast-enterprise-*-tests.jar
          retention-days: 1
      - uses: ./master/.github/actions/get-enterprise-license
        id: get-enterprise-license
        with:
          hazelcast-version: ${{ steps.compute_hz_version.outputs.hz_version }}
  setup_python_client_matrix:
    name: Setup the Python client test matrix
    if: ${{ inputs.run_python }}
    uses: ./.github/workflows/get-client-matrix.yaml
    with:
      client: py

  test_python_clients:
    needs: [ upload_jars, setup_python_client_matrix ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client_tag: ${{ fromJson(needs.setup_python_client_matrix.outputs.matrix) }}
        server_kind: [ os, enterprise ]
    name: Test Python client ${{ matrix.client_tag }} with ${{ matrix.server_kind }} server
    env:
      HAZELCAST_ENTERPRISE_KEY: ${{ secrets[needs.upload_jars.outputs.hazelcast_enterprise_key_secret] }}
    steps:
      - name: Checkout to scripts
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Read Java Config
        run: cat ${GITHUB_WORKSPACE}/.github/java-config.env >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Checkout to test artifacts
        if: ${{ matrix.server_kind == 'enterprise' }}
        uses: actions/checkout@v6
        with:
          repository: hazelcast/private-test-artifacts
          path: certs
          ref: data
          token: ${{ secrets.GH_PAT }}

      - name: Checkout to master
        uses: actions/checkout@v6
        with:
          repository: hazelcast/hazelcast-python-client
          path: master
          ref: master

      - name: Checkout to tag
        uses: actions/checkout@v6
        with:
          repository: hazelcast/hazelcast-python-client
          path: tag
          ref: ${{ matrix.client_tag }}

      - name: Copy the client code into master
        run: |
          rm -rf $GITHUB_WORKSPACE/master/hazelcast
          cp -a $GITHUB_WORKSPACE/tag/hazelcast $GITHUB_WORKSPACE/master/hazelcast

      - name: Create the test jar with certificates
        if: ${{ matrix.server_kind == 'enterprise' }}
        working-directory: certs
        run: |
          zip -r -j certs.jar $GITHUB_WORKSPACE/master/tests/integration/backward_compatible/ssl_tests/hostname_verification/*.p12
          mkdir ../jars
          cp certs.jar ../jars/hazelcast-enterprise-${{ matrix.version }}-tests.jar        

      - name: Install dependencies
        working-directory: master
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Download RCD
        shell: bash
        run: |
          wget -q https://client-rcd-download.s3.us-east-2.amazonaws.com/rcd-ubuntu-latest

      - name: Convert major.minor version to semver
        id: generate-semver
        run: |
          # `semver-utils` expects a fully qualified semver, but some older Python clients were major.minor (e.g. `v5.0`) which was unsupported
          # In those cases, convert major.minor (e.g. `v5.0`) -> major.minor.patch (e.g. `v.5.0.0`)
          VERSION="${{ matrix.client_tag }}"
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # https://github.com/madhead/semver-utils/releases/tag/v4.3.0
      - uses: madhead/semver-utils@36d1e0ed361bd7b4b77665de8093092eaeabe6ba
        id: client-version
        with:
          version: ${{ steps.generate-semver.outputs.version }}
          compare-to: 5.5.0

      - name: Download Hazelcast tests JAR
        uses: actions/download-artifact@v8
        with:
          name: hazelcast-tests
          path: jars

      - name: Download Hazelcast SQL JAR (if exists)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: hazelcast-sql
          path: jars

      - name: Download Hazelcast JAR
        if: ${{ matrix.server_kind == 'os' }}
        uses: actions/download-artifact@v8
        with:
          name: hazelcast
          path: jars

      - name: Download Hazelcast Enterprise JAR
        if: ${{ matrix.server_kind == 'enterprise' }}
        uses: actions/download-artifact@v8
        with:
          name: hazelcast-enterprise
          path: jars

      - name: Run tests
        env:
          HZ_VERSION: "${{ needs.upload_jars.outputs.hz_version }}"
          HAZELCAST_ENTERPRISE_KEY: ${{ secrets[needs.upload_jars.outputs.hazelcast_enterprise_key_secret] }}
        run: |
          chmod +x rcd-ubuntu-latest 
          ./rcd-ubuntu-latest -jars jars &
          # wait for a bit for RCD to download artifacts
          sleep 10
          
          args=(--verbose)
          if [ "${{ matrix.server_kind }}" = "os" ]; then
            args+=(-m "not enterprise")
          fi
          
          if [[ "${{ steps.client-version.outputs.comparison-result }}" = "<" ]]; then
            # Workaround https://github.com/hazelcast/hazelcast-python-client/issues/666 by skipping those tests
            args+=(--ignore master/tests/integration/backward_compatible/predicate_test.py)
            args+=(--ignore master/tests/integration/asyncio/predicate_test.py)
          fi
          pytest master/tests/integration/backward_compatible "${args[@]}"

  setup_nodejs_client_matrix:
    name: Setup the Node.js client test matrix
    if: ${{ inputs.run_nodejs }}
    uses: ./.github/workflows/get-client-matrix.yaml
    with:
      client: node
  test_nodejs_clients:
    needs: [ upload_jars, setup_nodejs_client_matrix ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client_tag: ${{ fromJson(needs.setup_nodejs_client_matrix.outputs.matrix) }}
        server_kind: [ os, enterprise ]
    name: Test Node.js client ${{ matrix.client_tag }} with ${{ matrix.server_kind }} server
    steps:
      - name: Checkout to scripts
        uses: actions/checkout@v6

      - name: Checkout to test artifacts
        if: ${{ matrix.kind == 'enterprise' }}
        uses: actions/checkout@v6
        with:
          repository: hazelcast/private-test-artifacts
          path: certs
          ref: data
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Read Java Config
        run: cat ${GITHUB_WORKSPACE}/.github/java-config.env >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Checkout to master
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.inputs.organization_name }}/hazelcast-nodejs-client
          path: master
          ref: master

      - name: Checkout to ${{ github.event.inputs.branch_name }}
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.inputs.organization_name }}/hazelcast-nodejs-client
          path: client
          ref: ${{ github.event.inputs.branch_name }}

      - name: Copy certificates JAR to destination with the appropriate name
        if: ${{ matrix.kind == 'enterprise' }}
        run: |
          cp $GITHUB_WORKSPACE/certs/certs.jar $GITHUB_WORKSPACE/hazelcast-enterprise-${{ matrix.version }}-tests.jar

      - name: Install dependencies and compile client
        run: |
          npm install
          npm run compile
        working-directory: client

      - name: Install test dependencies
        run: |
          npm install
        working-directory: master

      - name: Copy client code into master
        run: |
          rm -rf $GITHUB_WORKSPACE/master/lib
          rm $GITHUB_WORKSPACE/master/package.json
          cp -a $GITHUB_WORKSPACE/client/lib $GITHUB_WORKSPACE/master/lib
          cp -a $GITHUB_WORKSPACE/client/package.json $GITHUB_WORKSPACE/master/package.json

      - uses: ./.github/actions/get-enterprise-license
        id: get-enterprise-license
        with:
          hazelcast-version: ${{ matrix.version }}

      - name: Download RCD
        shell: bash
        run: |
          wget -q https://client-rcd-download.s3.us-east-2.amazonaws.com/rcd-ubuntu-latest

      - name: Run all tests
        env:
          HZ_VERSION: ${{ matrix.version }}
          HAZELCAST_ENTERPRISE_KEY: ${{ secrets[steps.get-enterprise-license.outputs.HAZELCAST_ENTERPRISE_KEY_SECRET] }}
        working-directory: master
        run: |
          if [ "${{ matrix.kind }}" = "os" ]; then
            unset HAZELCAST_ENTERPRISE_KEY
          fi
          cd $GITHUB_WORKSPACE && chmod +x ./rcd-ubuntu-latest && ./rcd-ubuntu-latest -version $HZ_VERSION -no-simple-server -log-level trace &
          # wait for a bit for RCD to download artifacts
          sleep 10
          node node_modules/mocha/bin/mocha --recursive test/integration/backward_compatible
